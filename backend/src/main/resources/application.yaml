spring:
  application:
    name: gamebridge-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
server:
  address: 127.0.0.1
  port: ${GAMEBRIDGE_PORT:18080}
  error:
    include-message: never
gamebridge:
  auth-rate:
    challenge-per-minute: ${GAMEBRIDGE_AUTH_CHALLENGE_PER_MINUTE:30}
    exchange-per-minute: ${GAMEBRIDGE_AUTH_EXCHANGE_PER_MINUTE:10}
