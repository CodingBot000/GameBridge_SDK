name: GameBridgeSample
options:
  deploymentTarget:
    iOS: '16.0'
configs:
  Debug: debug
  Release: release
packages:
  GameBridge:
    path: ..
targets:
  GameBridgeSample:
    type: application
    platform: iOS
    sources:
      - path: ../SampleApp
        excludes: ['*.plist', '*.example']
    dependencies:
      - package: GameBridge
        product: GameBridgeCore
      - package: GameBridge
        product: GameBridgeApple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamebridge.sdk.sample.dev20261110
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
      configs:
        Debug:
          INFOPLIST_FILE: ../SampleApp/Info-Debug.plist
        Release:
          INFOPLIST_FILE: ../SampleApp/Info-Release.plist
  GameBridgeRecoveryHarness:
    type: application
    platform: iOS
    sources:
      - ../RecoveryHarness
      - path: ../StoreKit/GameBridge.storekit
        buildPhase: resources
    dependencies:
      - package: GameBridge
        product: GameBridgeCore
      - package: GameBridge
        product: GameBridgeApple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamebridge.sdk.recovery.harness
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SDKROOT)/Developer/Library/Frameworks"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks $(PLATFORM_DIR)/Developer/Library/Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
      configs:
        Debug:
          INFOPLIST_FILE: ../SampleApp/Info-Debug.plist
  GameBridgeNative:
    type: framework.static
    platform: iOS
    sources:
      - ../Sources/GameBridgeCore
      - ../Sources/GameBridgeApple
      - ../UnityBridge
      - path: include/GameBridgeNative.h
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamebridge.sdk.native
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SWIFT_INSTALL_OBJC_HEADER: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GAMEBRIDGE_CORE_EMBEDDED
  GameBridgePushTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../PushTests
    dependencies:
      - target: GameBridgeSample
      - package: GameBridge
        product: GameBridgeApple
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
  GameBridgeStoreKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../StoreKitTests
      - path: ../StoreKit/GameBridge.storekit
        buildPhase: resources
    dependencies:
      - target: GameBridgeSample
      - package: GameBridge
        product: GameBridgeCore
      - package: GameBridge
        product: GameBridgeApple
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
  GameBridgeSampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../UITests
    dependencies:
      - target: GameBridgeSample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GameBridgeRecoveryHarness:
    build:
      targets:
        GameBridgeRecoveryHarness: all
    run:
      config: Debug
      storeKitConfiguration: ../StoreKit/GameBridge.storekit
  GameBridgeNative:
    build:
      targets:
        GameBridgeNative: all
  GameBridgeSample:
    build:
      targets:
        GameBridgeSample: all
        GameBridgeSampleUITests: [test]
    test:
      targets:
        - GameBridgeSampleUITests
  GameBridgeStoreKit:
    build:
      targets:
        GameBridgeSample: all
        GameBridgeStoreKitTests: [test]
    run:
      config: Debug
      storeKitConfiguration: ../StoreKit/GameBridge.storekit
    test:
      targets:
        - GameBridgeStoreKitTests
  GameBridgePushTests:
    build:
      targets:
        GameBridgeSample: all
        GameBridgePushTests: [test]
    test:
      targets:
        - GameBridgePushTests
