spring:
  application:
    name: gamebridge-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
server:
  address: 127.0.0.1
  port: ${GAMEBRIDGE_PORT:18080}
  error:
    include-message: never
gamebridge:
  session:
    access-ttl-seconds: ${GAMEBRIDGE_SESSION_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${GAMEBRIDGE_SESSION_REFRESH_TTL_SECONDS:604800}
  auth-rate:
    challenge-per-minute: ${GAMEBRIDGE_AUTH_CHALLENGE_PER_MINUTE:30}
    exchange-per-minute: ${GAMEBRIDGE_AUTH_EXCHANGE_PER_MINUTE:10}
  push:
    worker-concurrency: ${GAMEBRIDGE_PUSH_WORKER_CONCURRENCY:1}
    max-retries: ${GAMEBRIDGE_PUSH_MAX_RETRIES:3}
    initial-backoff-seconds: ${GAMEBRIDGE_PUSH_INITIAL_BACKOFF_SECONDS:5}
    dev-per-minute: ${GAMEBRIDGE_DEV_PUSH_PER_MINUTE:10}
  config:
    ttl-seconds: ${GAMEBRIDGE_CONFIG_TTL_SECONDS:300}
