services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: gamebridge_local
      POSTGRES_USER: gamebridge
      POSTGRES_PASSWORD: ${GAMEBRIDGE_DB_PASSWORD:?Set GAMEBRIDGE_DB_PASSWORD locally}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - gamebridge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamebridge -d gamebridge_local"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  gamebridge-db:
